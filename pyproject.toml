[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-charm-cat-surface-gpu"
version = "0.1.0.dev0"
description = "SimNIBS/CAT-Surface compatible GPU acceleration experiments"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "numpy>=1.24",
    "nibabel>=5.0",
    "torch>=2.6",
]

[project.optional-dependencies]
cuda = ["triton>=3.2"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
