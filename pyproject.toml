[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-surface-gpu"
version = "0.1.0"
description = "GPU acceleration for CAT_Surf2Sphere and CAT_SurfWarp-compatible surface registration"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "ayakacxy" },
]
keywords = [
    "CAT-Surface",
    "SimNIBS",
    "CUDA",
    "Triton",
    "cortical-surface",
    "neuroimaging",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "nibabel>=5.0",
    "torch>=2.6",
]

[project.optional-dependencies]
cuda = ["triton>=3.2"]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/ayakacxy/cat-surface-gpu"
Repository = "https://github.com/ayakacxy/cat-surface-gpu"
Issues = "https://github.com/ayakacxy/cat-surface-gpu/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
