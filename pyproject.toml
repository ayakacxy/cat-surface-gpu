[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-surface-gpu"
version = "0.3.1"
description = "Python CAT-Surface spherical inflation and registration for CPU, CUDA and Metal"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "THIRD_PARTY_NOTICES.zh-CN.md",
    "upstream/CAT-Surface-LICENSE.txt",
]
authors = [
    { name = "ayakacxy" },
]
keywords = [
    "CAT-Surface",
    "SimNIBS",
    "CUDA",
    "CuPy",
    "Numba",
    "cortical-surface",
    "neuroimaging",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "nibabel>=5.0",
    "scipy>=1.10",
    "numba>=0.59",
]

[project.scripts]
cat-surf2sphere-gpu = "cat_surface_gpu.cli:surf2sphere_main"
cat-surfwarp-gpu = "cat_surface_gpu.cli:surfwarp_main"

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13"]
metal = ["mlx>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'"]
test = ["build>=1.3", "pytest>=8.0", "ruff>=0.12"]

[project.urls]
Homepage = "https://github.com/ayakacxy/cat-surface-gpu"
Repository = "https://github.com/ayakacxy/cat-surface-gpu"
Issues = "https://github.com/ayakacxy/cat-surface-gpu/issues"
Changelog = "https://github.com/ayakacxy/cat-surface-gpu/blob/main/docs/CHANGELOG.md"
Documentation = "https://github.com/ayakacxy/cat-surface-gpu#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "cuda: requires a real CUDA device",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
