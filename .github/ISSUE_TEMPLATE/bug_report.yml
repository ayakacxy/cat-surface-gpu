name: Bug report
description: Report a reproducible correctness, installation, or runtime problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach identifiable medical data. Use synthetic or anonymized inputs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, GPU, driver, Python, PyTorch, Triton, and package version.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Reproduction command
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed personal, clinical, and identifiable data.
          required: true
        - label: I confirmed that CUDA was actually visible if this is a GPU report.
          required: true
