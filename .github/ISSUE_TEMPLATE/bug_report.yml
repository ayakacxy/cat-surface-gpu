name: Bug report
description: Report an installation, runtime, or numerical problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Use synthetic inputs and remove patient data, identifying information, and credentials from attachments.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the package version, OS, Python, CPU or GPU, and selected backend. For GPU issues, include the driver and CuPy or MLX version.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Steps to reproduce
      description: Provide the command or a minimal script, input surface sizes, and relevant settings.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Include the complete traceback or relevant log output.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed patient data, identifying information, and credentials.
          required: true
