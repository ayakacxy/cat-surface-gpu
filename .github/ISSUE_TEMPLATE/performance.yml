name: Performance report
description: Report a slowdown or share a reproducible benchmark.
title: "[Performance]: "
labels: [performance]
body:
  - type: markdown
    attributes:
      value: Include enough detail to repeat the measurement. Do not attach patient data, identifying information, or credentials.
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and software
      description: Include the CPU, GPU, RAM, OS, Python, package version or commit, selected backend, and relevant driver and library versions.
    validations:
      required: true
  - type: textarea
    id: workload
    attributes:
      label: Workload and measurement
      description: Provide the command, vertex and face counts, solver settings, precision, thread count, cache state, repetitions, synchronization, and which steps the timing includes.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Include individual timings or a summary with the number of repetitions. For comparisons, identify the baseline and report topology equality and numerical differences.
    validations:
      required: true
