name: CUDA validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90
    env:
      TMPDIR: ${{ github.workspace }}/.work/gpu-ci/tmp
      TMP: ${{ github.workspace }}/.work/gpu-ci/tmp
      TEMP: ${{ github.workspace }}/.work/gpu-ci/tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/.work/gpu-ci/cache
      PIP_CACHE_DIR: ${{ github.workspace }}/.work/gpu-ci/cache/pip
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.work/gpu-ci/cache/numba
      CUPY_CACHE_DIR: ${{ github.workspace }}/.work/gpu-ci/cache/cupy
      CUDA_CACHE_PATH: ${{ github.workspace }}/.work/gpu-ci/cache/cuda
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.work/gpu-ci/cache/pycache
      OMP_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      NUMBA_NUM_THREADS: "8"
    steps:
      - uses: actions/checkout@v7
      - name: Create isolated validation environment
        run: |
          mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"
          python3.11 -m venv .work/gpu-ci/venv
          .work/gpu-ci/venv/bin/python -m pip install --upgrade pip
          .work/gpu-ci/venv/bin/python -m pip install '.[cuda,test]'
      - name: Require a real CUDA device
        run: |
          .work/gpu-ci/venv/bin/python - <<'PY'
          import cupy as cp
          assert cp.cuda.runtime.getDeviceCount() > 0
          print(cp.__version__, cp.cuda.runtime.runtimeGetVersion(), cp.cuda.runtime.getDeviceProperties(0)['name'])
          PY
      - name: Run CPU and CUDA tests
        run: .work/gpu-ci/venv/bin/python -m pytest -q --basetemp .work/gpu-ci/pytest -o cache_dir=.work/gpu-ci/cache/pytest
