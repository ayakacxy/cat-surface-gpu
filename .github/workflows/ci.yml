name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/.work/ci/tmp
      TMP: ${{ github.workspace }}/.work/ci/tmp
      TEMP: ${{ github.workspace }}/.work/ci/tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/.work/ci/cache
      PIP_CACHE_DIR: ${{ github.workspace }}/.work/ci/cache/pip
      CAT_SURFACE_CACHE_ROOT: ${{ github.workspace }}/.work/ci/cache/targets
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.work/ci/cache/numba
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.work/ci/cache/pycache
      RUFF_CACHE_DIR: ${{ github.workspace }}/.work/ci/cache/ruff
      OMP_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      NUMBA_NUM_THREADS: "8"
    steps:
      - uses: actions/checkout@v7
      - name: Prepare project-local work directories on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:TMPDIR, $env:XDG_CACHE_HOME | Out-Null
      - name: Prepare project-local work directories on Unix
        if: runner.os != 'Windows'
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'
      - name: Verify source
        run: python scripts/verify_release.py
      - name: Lint and format check
        run: |
          ruff check src tests tools scripts setup.py
          ruff format --check src tests tools scripts setup.py
      - name: Run CPU tests
        run: pytest -q --basetemp .work/ci/pytest -o cache_dir=.work/ci/cache/pytest
      - name: Build wheel and source archive
        run: python -m build --outdir .work/ci/dist
      - name: Verify wheel contents
        run: python scripts/verify_release.py --wheel .work/ci/dist/cat_surface_gpu-0.3.0-py3-none-any.whl
      - name: Test installed command-line interfaces
        run: |
          python -m pip install --force-reinstall --no-deps .work/ci/dist/*.whl
          cat-surf2sphere-gpu --help
          cat-surfwarp-gpu --help
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ matrix.os }}
          path: .work/ci/dist/*
          if-no-files-found: error
